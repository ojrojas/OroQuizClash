openapi: 3.0.3
info:
  title: OroQuizClash Player Withdrawal API
  version: 1.0.0
  description: Player withdrawal and participation status endpoints (SPEC-008)
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /games/{gameId}/withdraw:
    post:
      operationId: withdrawPlayer
      summary: Withdraw the current player from an active game
      description: |
        Voluntarily ends the player's participation. Applies the game's configured
        withdrawal policy to determine retained points. Atomic and irreversible.
        The player identity is derived from the JWT `sub` claim (server-authoritative).
      tags: [Withdrawal]
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Withdrawal completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawResponse' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Not authenticated
        '404':
          description: Game not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: Conflict — already withdrawn, already eliminated, participation finished, game finished, or concurrency conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /games/{gameId}/players/{playerId}/status:
    get:
      operationId: getPlayerParticipationStatus
      summary: Get a player's participation status
      description: Returns the participation status (ACTIVE/WITHDRAWN/ELIMINATED/WINNER) for a player in a game.
      tags: [Withdrawal]
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: playerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Participation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipationStatusResponse' }
        '404':
          description: Game or player not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WithdrawResponse:
      type: object
      required: [gameId, playerId, participationStatus, pointsDeducted, finalScore, withdrawalPolicy]
      properties:
        gameId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        participationStatus:
          type: string
          enum: [WITHDRAWN]
          description: Always WITHDRAWN on success
        pointsDeducted: { type: integer, description: Points removed by the withdrawal policy }
        finalScore: { type: integer, description: Points retained after withdrawal }
        withdrawalPolicy: { type: string, description: Applied policy name (e.g., KEEP_SECURED_SCORE) }
        withdrawnAt: { type: string, format: date-time }
    ParticipationStatusResponse:
      type: object
      required: [gameId, playerId, participationStatus]
      properties:
        gameId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        participationStatus:
          type: string
          enum: [ACTIVE, WITHDRAWN, ELIMINATED, WINNER]
        currentPoints: { type: integer }
        securedPoints: { type: integer }
        exitedAt: { type: string, format: date-time, nullable: true }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
